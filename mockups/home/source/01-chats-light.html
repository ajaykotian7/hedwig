<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home chats light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="screen">
  <div class="top">
    <div class="status"><span>9:41</span><span class="status-icons"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21L.6 8.4C3.7 5.6 7.7 4 12 4s8.3 1.6 11.4 4.4z"/></svg><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg><svg aria-hidden="true" width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><path d="M3 0h4v2h2a1 1 0 011 1v12a1 1 0 01-1 1H1a1 1 0 01-1-1V3a1 1 0 011-1h2z"/></svg></span></div>
    <div class="appbar"><span class="title">hedwig</span><span class="icon-button" role="button" aria-label="Sign out"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></span></div>
    <div class="tabs" role="tablist" data-progress="0">
      <div class="tab selected" role="tab"><span>Chats</span></div>
      <div class="tab" role="tab"><span>Profile</span></div>
      <div class="indicator"></div>
    </div>
  </div>
  <div class="pager"><div class="pages" style="transform: translateX(calc(-390px * 0));"><div class="page"><div class="empty"><div class="empty-art"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><path d="M15 4v7H5.17L4 12.17V4h11m1-2H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1zm5 4h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1z"/></svg></div><h2>No chats yet</h2><p>Tap the new chat button to message anyone on hedwig.</p></div></div><div class="page"><div class="empty"><div class="empty-art"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><path d="M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2m0-12C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z"/></svg></div><h2>Your profile</h2><p>Your name, about and phone number will live here.</p></div></div></div></div>
  <div class="fab" role="button" aria-label="New chat"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M22 4c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2L2 16c0 1.1.9 2 2 2h14l4 4-.01-18zM17 11h-4v4h-2v-4H7V9h4V5h2v4h4v2z"/></svg></div>
  <div class="nav"></div>
</div>
<script>
// Lerp the indicator between the two labels, like the pager's currentPage + offset fraction.
document.fonts.ready.then(() => {
  const tabs = document.querySelector('.tabs');
  const t = parseFloat(tabs.dataset.progress);
  const base = tabs.getBoundingClientRect();
  const [a, b] = [...tabs.querySelectorAll('.tab span')].map(s => s.getBoundingClientRect());
  const left = a.left + (b.left - a.left) * t - base.left;
  const width = a.width + (b.width - a.width) * t;
  const ind = tabs.querySelector('.indicator');
  ind.style.left = left + 'px';
  ind.style.width = width + 'px';
});
</script>
</body>
</html>
