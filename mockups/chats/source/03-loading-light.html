<script>
// Put the indicator under the selected label's text, like matchContentSize = true.
document.fonts.ready.then(() => {
  const tabs = document.querySelector('.tabs');
  const base = tabs.getBoundingClientRect();
  const r = tabs.querySelector('.tab.selected span').getBoundingClientRect();
  const ind = tabs.querySelector('.indicator');
  ind.style.left = (r.left - base.left) + 'px';
  ind.style.width = r.width + 'px';
});
</script>
