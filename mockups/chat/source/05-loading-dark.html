<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="chat.css">
</head>
<body>
<div class="screen dark">
  <div class="top">

      <div class="peer"><span class="avatar bar-bone"></span><div class="peer-text"><div class="bar-bone" style="width: 128px; height: 16px; border-radius: 8px;"></div><div class="bar-bone" style="width: 88px; height: 12px; border-radius: 6px; margin-top: 8px;"></div></div></div>
    </div>
  </div>
  <div class="messages" aria-busy="true">

    <div class="msg theirs"><div class="bone" style="width: 236px; height: 55px;"></div></div>

    <div class="msg theirs first"><div class="bone" style="width: 200px; height: 34px;"></div></div>

  <div class="nav"></div>
