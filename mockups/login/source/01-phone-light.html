<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login phone step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A38FF}a:hover{color:#6A1FD9}
input::placeholder{color:#8E8898}
input:focus{outline:none}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 28px; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1B20; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <div style="width: 64px; height: 64px; border-radius: 20px; background: #E9DBFD; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    <img src="owl.webp" alt="hedwig owl logo" style="width: 96px; height: 96px;">
  </div>

  <h1 style="margin: 32px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px;">What's your number?</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; color: #6F6A78;">We'll text you a 6-digit code to make sure it's really you.</p>

  <label for="phone" style="margin-top: 36px; font-size: 13px; font-weight: 600; color: #6F6A78;">Mobile number</label>
  <div style="margin-top: 8px; height: 60px; box-sizing: border-box; border-radius: 16px; background: #F6F2FC; border: 2px solid #8A38FF; display: flex; align-items: center; padding: 0 16px; gap: 12px;">
    <button type="button" aria-label="Country code, India +91" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: none; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #1D1B20;">
      <span style="font-size: 11px; font-weight: 700; color: #6F6A78; letter-spacing: 0.5px;">IN</span>
      <span>+91</span>
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6F6A78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <div style="width: 1px; height: 28px; background: #DDD5E8;"></div>
    <input id="phone" type="tel" value="98765 43" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 19px; font-weight: 600; letter-spacing: 1px; color: #1D1B20;">
  </div>
  <p style="margin: 10px 0 0; font-size: 12px; line-height: 16px; color: #6F6A78;">8 of 10 digits</p>

  <div style="flex-grow: 1;"></div>

  <button type="button" disabled style="height: 56px; border: none; border-radius: 28px; background: #EFEAF5; color: #6F6A78; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
    Get code
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </button>
  <p style="margin: 16px 0 0; font-size: 12px; line-height: 18px; color: #6F6A78; text-align: center;">By continuing you agree to hedwig's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
</div>
</body>
</html>
