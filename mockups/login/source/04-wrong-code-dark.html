<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login wrong code dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#DCC6FB}a:hover{color:#EFE4FD}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; background: #141218; color: #E6E0E9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <button type="button" aria-label="Back to phone number" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #1D1A22; display: flex; align-items: center; justify-content: center; color: #E6E0E9;">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
  </button>

  <h1 style="margin: 28px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px;">Enter the code</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; color: #9C96A4;">Sent by SMS to <span style="font-weight: 700; color: #E6E0E9;">+91 98765 43210</span>  <a href="#" style="font-weight: 700; text-decoration: none;">Edit</a></p>

  <div role="group" aria-label="6-digit code, incorrect" style="margin-top: 36px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">4</div>
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">8</div>
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">2</div>
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">9</div>
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">1</div>
    <div style="height: 60px; border-radius: 14px; background: #2A1E22; border: 2px solid #F2B8B5; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #F2B8B5;">0</div>
  </div>

  <div role="alert" style="margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #F2B8B5;">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
    <span>That code didn't match. Check the SMS and try again.</span>
  </div>

  <a href="#" style="margin-top: 20px; align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 700; text-decoration: none;">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
    Resend code
  </a>

  <div style="flex-grow: 1;"></div>

  <button type="button" style="height: 56px; border: none; border-radius: 28px; background: #8A38FF; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700;">Verify</button>
</div>
</body>
</html>
