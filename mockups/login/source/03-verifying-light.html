<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login verifying</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A38FF}a:hover{color:#6A1FD9}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1B20; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <button type="button" disabled aria-label="Back to phone number" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #F6F2FC; display: flex; align-items: center; justify-content: center; color: #B3ADBC;">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
  </button>

  <h1 style="margin: 28px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px;">Enter the code</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; color: #6F6A78;">Sent by SMS to <span style="font-weight: 700; color: #1D1B20;">+91 98765 43210</span></p>

  <div role="group" aria-label="6-digit code" style="margin-top: 36px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; opacity: 0.6;">
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">4</div>
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">8</div>
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">2</div>
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">9</div>
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">1</div>
    <div style="height: 60px; border-radius: 14px; background: #F0E6FE; border: 1.5px solid #D9C4FB; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">3</div>
  </div>

  <div style="margin-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6F6A78;">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span>Resend code in <span style="font-weight: 700; font-variant-numeric: tabular-nums; color: #1D1B20;">0:37</span></span>
  </div>

  <div style="flex-grow: 1;"></div>

  <button type="button" aria-busy="true" style="height: 56px; border: none; border-radius: 28px; background: #8A38FF; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" style="animation: spin 0.9s linear infinite;"><circle cx="12" cy="12" r="9" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path></svg>
    Verifying…
  </button>
</div>
</body>
</html>
