<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login code step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A38FF}a:hover{color:#6A1FD9}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1B20; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <button type="button" aria-label="Back to phone number" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #F6F2FC; display: flex; align-items: center; justify-content: center; color: #1D1B20;">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
  </button>

  <h1 style="margin: 28px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px;">Enter the code</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; color: #6F6A78;">Sent by SMS to <span style="font-weight: 700; color: #1D1B20;">+91 98765 43210</span>  <a href="#" style="font-weight: 700; text-decoration: none;">Edit</a></p>

  <div role="group" aria-label="6-digit code" style="margin-top: 36px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 60px; border-radius: 14px; background: #F6F2FC; border: 1.5px solid #E2DAEC; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">4</div>
    <div style="height: 60px; border-radius: 14px; background: #F6F2FC; border: 1.5px solid #E2DAEC; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">8</div>
    <div style="height: 60px; border-radius: 14px; background: #F6F2FC; border: 1.5px solid #E2DAEC; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;">2</div>
    <div style="height: 60px; border-radius: 14px; background: #FFFFFF; border: 2px solid #8A38FF; box-shadow: 0 0 0 4px #F0E6FE; display: flex; align-items: center; justify-content: center;">
      <div style="width: 2px; height: 26px; border-radius: 1px; background: #8A38FF;"></div>
    </div>
    <div style="height: 60px; border-radius: 14px; background: #F6F2FC; border: 1.5px solid #EBE6F0;"></div>
    <div style="height: 60px; border-radius: 14px; background: #F6F2FC; border: 1.5px solid #EBE6F0;"></div>
  </div>

  <div style="margin-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6F6A78;">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span>Resend code in <span style="font-weight: 700; font-variant-numeric: tabular-nums; color: #1D1B20;">0:42</span></span>
  </div>

  <div style="flex-grow: 1;"></div>

  <button type="button" disabled style="height: 56px; border: none; border-radius: 28px; background: #EFEAF5; color: #6F6A78; font-family: inherit; font-size: 16px; font-weight: 700;">Verify</button>
</div>
</body>
</html>
